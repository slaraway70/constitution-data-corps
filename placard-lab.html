<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Placard Lab | Old Glory Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>:root{--blue:#0A3161;--red:#B31942;--line:#d8dee9;--paper:#eef1f6}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:var(--paper);min-height:100vh}.top{height:64px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:4px solid var(--red);position:sticky;top:0;z-index:10}.wrap{display:grid;grid-template-columns:360px 1fr;min-height:calc(100vh - 64px)}.ctrl{background:#fff;border-right:1px solid var(--line);padding:22px 20px}.lab{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--blue);margin:18px 0 8px}input,select,textarea{width:100%;border:1px solid var(--line);padding:10px 12px;font-family:Inter,sans-serif;font-size:14px}textarea{height:86px;resize:vertical}.btn{width:100%;padding:12px;background:var(--blue);color:#fff;border:0;font-weight:800;letter-spacing:.12em;font-size:12px;cursor:pointer;margin-top:12px}.btn.red{background:var(--red)}.preview{background:#d9dee8;display:grid;place-items:center;padding:28px}.paper{width:100%;max-width:640px;aspect-ratio:3/4;background:#fff;box-shadow:0 20px 60px rgba(10,49,97,.25);position:relative;overflow:hidden;display:flex;flex-direction:column}.p-head{background:var(--blue);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:6px solid var(--red)}.p-body{flex:1;padding:28px 26px;display:flex;flex-direction:column;justify-content:center}.p-foot{padding:14px 22px;border-top:1px solid #e8edf5;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.15em;color:#6b7a90}@media(max-width:900px){.wrap{grid-template-columns:1fr}}</style></head>
<body><div class="top"><div style="font-family:'Playfair Display';font-weight:900;letter-spacing:.06em">PLACARD LAB — FORGE YOUR PROCLAMATION</div><div style="font-size:10px;letter-spacing:.18em;opacity:.8">OLD GLORY EDITION</div></div>
<div class="wrap"><div class="ctrl">
<div class="lab">Headline</div><input id="h" value="LIBERTY WEEKEND">
<div class="lab">Subhead</div><input id="s" value="A Celebration of Freedom • July 3-6, 1986">
<div class="lab">Body</div><textarea id="b">We the People rededicate ourselves to the cause of liberty. The Statue of Liberty stands restored, a beacon for all who yearn to breathe free.</textarea>
<div class="lab">Style</div><select id="st"><option value="proclamation">Proclamation</option><option value="campaign">Campaign</option><option value="seal">Presidential Seal</option><option value="stripes">Stripes</option></select>
<div class="lab">Year Mark</div><input id="y" value="REAGAN 1986">
<button class="btn" onclick="window.print()">PRINT / SAVE PDF</button><button class="btn red" onclick="rnd()">RANDOMIZE ★</button>
<div style="margin-top:18px;font-size:11px;color:#6b7a90;line-height:1.5">Live update. Old Glory Blue #0A3161 / Red #B31942 baked in.</div>
</div><div class="preview"><div class="paper" id="paper"><div class="p-head"><div style="font-weight:900;letter-spacing:.12em;font-size:13px">OLD GLORY EDITION</div><div style="letter-spacing:.3em">★ ★ ★ ★ ★</div></div><div class="p-body" id="pb"></div><div class="p-foot"><span id="yf">REAGAN 1986</span><span>#0A3161 #B31942</span></div></div></div></div>
<script>
const h=document.getElementById('h'),s=document.getElementById('s'),b=document.getElementById('b'),y=document.getElementById('y'),st=document.getElementById('st'),pb=document.getElementById('pb'),yf=document.getElementById('yf'),paper=document.getElementById('paper');
function render(){
 yf.textContent=y.value||'REAGAN 1986';let html='',v=h.value;
 if(st.value==='proclamation'){html=`<div style="border:3px solid #0A3161;padding:22px"><div style="font-size:10px;letter-spacing:.22em;color:#B31942;font-weight:800;margin-bottom:10px">BY PROCLAMATION</div><div style="font-family:'Playfair Display';font-weight:900;font-size:44px;line-height:.95;color:#0A3161;text-transform:uppercase">${v}</div><div style="margin-top:12px;height:3px;background:linear-gradient(90deg,#0A3161,#B31942)"></div><div style="margin-top:14px;font-size:13px;font-weight:700;color:#0A3161">${s.value}</div><div style="margin-top:18px;font-size:14px;line-height:1.6;color:#24324d">${b.value}</div></div>`}
 else if(st.value==='campaign'){html=`<div style="text-align:center"><div style="display:inline-block;border:4px solid #0A3161;padding:6px 14px;font-size:10px;letter-spacing:.2em;font-weight:900;color:#0A3161">REAGAN • 1986 • USA</div><div style="font-family:'Playfair Display';font-weight:900;font-size:54px;line-height:.9;color:#B31942;margin-top:18px;text-transform:uppercase">${v}</div><div style="font-weight:800;letter-spacing:.15em;color:#0A3161;margin-top:12px;font-size:13px">${s.value}</div><div style="margin-top:18px;font-size:14px;line-height:1.6;color:#24324d">${b.value}</div></div>`}
 else if(st.value==='seal'){html=`<div style="text-align:center"><div style="width:84px;height:84px;border-radius:50%;border:3px solid #0A3161;margin:0 auto;display:grid;place-items:center;font-family:'Playfair Display';font-weight:900;font-size:32px;color:#0A3161">40</div><div style="font-family:'Playfair Display';font-weight:900;font-size:36px;color:#0A3161;margin-top:16px;text-transform:uppercase">${v}</div><div style="color:#B31942;font-weight:800;letter-spacing:.18em;font-size:11px;margin-top:8px">${s.value}</div><div style="margin-top:18px;font-size:14px;line-height:1.6">${b.value}</div></div>`}
 else{html=`<div><div style="background:#0A3161;color:#fff;display:inline-block;padding:6px 12px;font-size:10px;letter-spacing:.2em;font-weight:900">OLD GLORY</div><div style="font-family:'Playfair Display';font-weight:900;font-size:44px;line-height:.95;color:#0A3161;margin-top:14px;text-transform:uppercase"><span style="color:#B31942">${v.split(' ')[0]}</span> ${v.split(' ').slice(1).join(' ')}</div><div style="margin-top:12px;border-left:5px solid #B31942;padding-left:14px"><div style="font-weight:700;color:#0A3161">${s.value}</div><div style="margin-top:10px;font-size:14px;line-height:1.6">${b.value}</div></div></div>`}
 pb.innerHTML=html;
}
function rnd(){const o=[["LIBERTY CENTENNIAL","The Statue Stands Restored • July 4, 1986","100 years welcoming the world."],["MORNING IN AMERICA","Still Morning • 1986","America's best days lie ahead."],["TAX REFORM ACT","Historic Simplification • Oct 22, 1986","Fairer, simpler code."]];let p=o[Math.floor(Math.random()*o.length)];h.value=p[0];s.value=p[1];b.value=p[2];render();}
[h,s,b,y,st].forEach(e=>e.addEventListener('input',render));render();
</script></body></html>
